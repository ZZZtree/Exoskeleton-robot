dependencies:
  idf: ">=5.4"

  video_server:
    path: "../components/video_server"

  h264_udp:
    path: "../components/h264_udp"

  ota_manager:
    path: "../components/ota_manager"

  espressif/esp_video:
    path: "../components/esp_video"

  example_video_common:
    path: "../components/example_video_common"

  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common

  espressif/mdns: "^1.0.3"

  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "*"

  espressif/cjson: "^1.7.15"
